[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-terraform-devops-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.162.0",
  "pydantic==2.11.5",
  "starlette==1.10.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==9.0.3", "ruff==0.17.3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
